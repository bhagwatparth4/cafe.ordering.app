<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café Staff</title><style>body{font-family:system-ui;max-width:1100px;margin:auto;padding:24px;background:#f7f4ef}input,button,select{padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc}button{background:#222;color:#fff}.order{background:#fff;padding:16px;margin:12px 0;border-radius:14px}header{display:flex;justify-content:space-between}</style></head><body><header><h1>☕ Café Staff</h1><a href="/">Customer view</a></header><div id="app"></div><script>
const api=async(p,o={})=>{let r=await fetch('/api'+p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d};
let token=localStorage.adminToken;
async function login(){try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#pass').value})});localStorage.adminToken=d.token;location.reload()}catch(e){alert(e.message)}}
async function load(){let a=document.querySelector('#app');if(!token){a.innerHTML='<h2>Staff login</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button>';return}try{let orders=await api('/admin/orders',{headers:{Authorization:'Bearer '+token}});a.innerHTML='<h2>Live orders</h2>'+orders.map(o=>'<div class="order"><b>Order #'+o.order_number+'</b> · '+o.mobile_number+' · '+o.order_type+(o.table_number?' · Table '+o.table_number:'')+'<p>'+o.items.map(x=>x.name+' × '+x.quantity).join(', ')+'</p><b>₹'+(o.total_paise/100).toFixed(0)+'</b><br><select onchange="status(\\''+o.id+'\\',this.value)"><option>'+o.status+'</option><option>PENDING</option><option>ACCEPTED</option><option>PREPARING</option><option>READY</option><option>COMPLETED</option><option>CANCELLED</option></select></div>').join('')}catch(e){a.innerHTML='<p>'+e.message+'</p>'}}
async function status(id,s){try{await api('/admin/orders/'+id+'/status',{method:'PATCH',headers:{Authorization:'Bearer '+token},body:JSON.stringify({status:s})});load()}catch(e){alert(e.message)}} load();
</script></body></html>
